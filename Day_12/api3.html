<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            text-align: center;
            font-family: 'Times New Roman', Times, serif;
        }

        input,
        button {
            padding: 10px;
            margin: 10px;
        }
    </style>
</head>

<body>
    <h2>Weather App</h2>
    <input type="text" id="city" value="city" placeholder="Enter the City name">
    <button onclick="getwet()">Get Weather</button>
    <p id="weather"></p>
    <script>
        const API_KEY = "dd2def2d5283fde9c16ded76152bba60";
        async function getwet() {
            let city = document.getElementById("city").value;
            let url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${API_KEY}`;
            let response = await fetch(url);
            let data = await response.json();
            console.log(data);
            document.getElementById("weather").innerHTML = `${data.main.temp}`;
        }

    </script>
</body>

</html>
