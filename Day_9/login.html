        <script>
            
    function check() {
        let name = document.getElementById("int1").value;
        let pwd = document.getElementById("pwd").value;

        let flag = 1;
        let message = "";

        let namePattern = /^[A-Za-z]+$/;

        if (name == "") {
            message += "Name required\n";
            flag = 0;
        } 
        else if (!name.match(namePattern)) {
            message += "Name should contain only letters\n";
            flag = 0;
        }

        if (pwd == "") {
            message += "Password is required\n";
            flag = 0;
        } 
        else if (pwd.length < 8) {
            message += "Password must be at least 8 characters\n";
            flag = 0;
        }

        if (flag == 0) {
            alert(message);  
            return false;
        }

        return true;
    }
    </script>
