<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Div Tag</title>
</head>

<body>
    <div style="border:2px solid rgb(255, 0, 81); padding: 10px; margin: 10px;">
        <div style="border: 2px dotted black;display:inline-block"><img src="/images/bmw.jpg" alt="bmw img"></div>
        <div style="border: 2px dotted black;display:inline-block"><img src="/images/car.jpg" alt="car img"></div>
        <div style="border: 2px dotted black;display:inline-block"><img src="/images/porche.jpg" alt="porche img"></div>
    </div>


    <div style="display: inline-block;">
        <h1>A</h1>
    </div>
    <div style="display: inline-block;">
        <h1>B</h1>
    </div>
    <div>
        <h1>C</h1>
    </div>
    <div style="display: inline-block;">
        <h1>D</h1>
    </div>

</body>

</html>
