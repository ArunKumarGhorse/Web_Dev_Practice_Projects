<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    Enter User Name
    <input type="text" id="userid" size="50">

    <br><br>

    Enter Your Password
    <input type="password" id="pwd" size="50" onmouseover="myfun1()" onmouseout="myfun2()">

    <br><br>

    <script>
        function myfun1() {
            document.getElementById("pwd").type = "text";
        }

        function myfun2() {
            document.getElementById("pwd").type = "password";
        }
    </script>

</body>

</html>
