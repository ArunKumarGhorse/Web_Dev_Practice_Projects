<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            background-image: url(/images/hotelroom.jpg.jpeg);
        }

        #x {
            background-color: rgb(255, 255, 255);
            margin-top: 50px;
            margin-left: 500px;
            margin-right: 500px;
            margin-bottom: 10px solid black;
            border-radius: 10%;
            box-shadow: 0px 0px 1px 1px rgb(220, 27, 213);
        }

        input {
            border-top: 0px;
            border-left: 0px;
            border-right: 0px;
            border-bottom: 3px;
            height: 30px;
            width: 100%;
        }

        input:hover {
            background-color: rgb(255, 255, 255);
        }
    </style>
</head>

<body>
    <div id="x" align="center">
        <div style="margin-left: 40px; margin-right: 40px;">
            <form>
                <legend>
                    <h1>Registration</h1>
                </legend>

                <input type="text" placeholder="Full Name">
                <hr>
                <br><br>
                <input type="mail" placeholder="Email Id">
                <hr>
                <br><br>
                <input type="tel" placeholder="Phone Number">
                <hr>
                <br><br>
                <input type="date" placeholder="dd-mm-yyyy">
                <hr>
                <br><br>
                <input type="text" placeholder="Adhar Card">
                <hr>
                <br><br>
                <input type="file">
                <h3>*Please Add the aadhar card in pdf Formate.</h3>
                <br>
                <button
                    style="width:300px; height: 30px;border-radius: 5px; background: linear-gradient(purple,white,purple); margin-bottom: 40px;">
                    Register</button>
                <br>
            </form>
        </div>

    </div>
</body>

</html>
