<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main {
            background: palevioletred;
            height: 200px;
            width: 100%;
        }

        .box-orange {
            background: orange;
            height: 100px;
            width: 100px;
            position: relative;
            top: 100px;
            left: 80%;
        }

        .box-blue {
            background: lightskyblue;
            height: 100px;
            width: 100px;
            position: static;
        }
        .box-green{
            background:green;
            height: 100px;
            width: 100px;
            position: relative;
            bottom: 100px;
            left: 40%;
        }
    </style>
</head>

<body>
    <div class="main">
        <div class="box-orange"></div>
        <div class="box-blue"></div>
        <div class="box-green"></div>
    </div>
</body>

</html>
