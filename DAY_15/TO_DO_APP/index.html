<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TO-DO-LLIST</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <div id="container">
        <div>
            <div style="display: inline-block">
                <h2 style="text-align: left;">Todo App</h2>
            </div>
            <div id="mode" onclick="tg()" style="display: inline-block; align-items:right;"><button>🌙</button></div>
        </div>
        <input type="text" id="input" placeholder="Enter your task here">
        <button id="addTask" onclick="addTask()">Add Task</button>

        <div id="taskContainer">
            <ol id="task-list"></ol>
        </div>

        <button id="clearTasks" onclick="clearTasks()">Clear All Tasks</button>
    </div>
</body>


</html>
