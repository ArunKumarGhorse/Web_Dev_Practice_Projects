<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #d1 {
            border: 2px solid black;
            background-color: rgb(44, 190, 219);
            height: 200px;
            width: 300px;
            text-align: center;
            align-content: center;
        }
    </style>
</head>

<body>
    <div id="d1" style="display:flex;">

    </div>


    <script>
        var choice = 1;
        switch (choice) {
            case 1:
                document.getElementById("d1").innerHTML = "<<h1>This is Choice 1</h1>>";
                break;
            case 2:
                document.getElementById("d1").innerHTML = "<h1>This is Choice 2</h1>";
                break;
            case 3:
                document.getElementById("d1").innerHTML = "<h1>This is Choice 3</h1>";
                break;
            default:
                document.getElementById("d1").innerHTML = "<h1>This is Default Choice</h1>";
        }
    </script>
</body>

</html>
