<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="p1"></h1>
    <script>
        var a = 100;
        var b = 200;
        var c = 300;
        if (a > b && a > c) {
            document.getElementById("p1").innerHTML = "a is greatest";
        } else if (b > a && b > c) {
            document.getElementById("p1").innerHTML = "b is greatest";
        } else {
            document.getElementById("p1").innerHTML = "c is greatest";
        }
    </script>
</body>

</html>
