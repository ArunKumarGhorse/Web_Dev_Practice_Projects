<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var a = prompt("Enter Month name:");
        switch (a) {
            case "January":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "February":
                document.write("<h1>Number of days in " + a + " is 28 or 29</h1>");
                break;
            case "March":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "April":
                document.write("<h1>Number of days in " + a + " is 30</h1>");
                break;
            case "May":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "June":
                document.write("<h1>Number of days in " + a + " is 30</h1>");
                break;
            case "July":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "August":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "September":
                document.write("<h1>Number of days in " + a + " is 30</h1>");
                break;
            case "October":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            case "November":
                document.write("<h1>Number of days in " + a + " is 30</h1>");
                break;
            case "December":
                document.write("<h1>Number of days in " + a + " is 31</h1>");
                break;
            default:
                document.write("<h1>Please enter valid month name.</h1>")
        }
    </script>
</body>

</html>
