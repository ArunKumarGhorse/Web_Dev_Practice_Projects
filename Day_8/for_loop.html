<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box {
            height: 100%;
            width: 50px;
            background-color: aqua;
            border: 2px solid black;
            margin: 10px;
            padding-top: 3px;
            float: left;
            text-align: center;
            box-shadow: 0em 0em 0.5em rgb(244, 12, 167);

        }

        .box:hover {
            box-shadow: 0em 0em 1em rgb(244, 12, 167);
        }

        #A {
            background-color: rgb(255, 0, 0);
        }

        #B {
            background-color: rgb(255, 127, 0);
        }

        #C {
            background-color: rgb(255, 255, 0);
        }

        #D {
            background-color: rgb(127, 255, 0);
        }

        #E {
            background-color: rgb(0, 255, 0);
        }

        #F {
            background-color: rgb(0, 255, 127);
        }

        #G {
            background-color: rgb(0, 255, 255);
        }

        #H {
            background-color: rgb(0, 127, 255);
        }

        #I {
            background-color: rgb(0, 0, 255);
        }
    </style>
</head>

<body bgcolor="white">
    <h1
        style="background: linear-gradient(to right, rgb(255, 0, 0), rgb(255, 127, 0), rgb(255, 255, 0), rgb(127, 255, 0), rgb(0, 255, 0), rgb(0, 255, 127), rgb(0, 255, 255), rgb(0, 127, 255), rgb(0, 0, 255)); color: rgb(13, 29, 30); text-align: center;">
        1 to 10 Multiplication Table</h1>
    <div id="obox" style="align-items: center; display: flex; justify-content: center; flex-direction: row;">
        <div class="box" id="A"></div>
        <div class="box" id="B"></div>
        <div class="box" id="C"></div>
        <div class="box" id="D"></div>
        <div class="box" id="E"></div>
        <div class="box" id="F"></div>
        <div class="box" id="G"></div>
        <div class="box" id="H"></div>
        <div class="box" id="I"></div>
    </div>

    <script>
        var a = 2;
        var id = "A";
        while (a <= 10) {
            for (var i = 1; i <= 10; i++) {

                document.getElementById(id).innerHTML += (a * i) + "<br><br>";
                if (i == 10) {
                    a++;
                    id = String.fromCharCode(id.charCodeAt(0) + 1);
                }
            }
        }
    </script>
</body>

</html>
