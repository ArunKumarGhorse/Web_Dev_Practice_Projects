<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        var a = prompt("Enetr User Name :");
        var b = parseFloat(prompt("Enetr User Age :"));
        var c = [];
        c[0] = parseFloat(prompt("Enter user Marks:"));
        c[1] = parseFloat(prompt("Enter user Marks:"));
        c[2] = parseFloat(prompt("Enter user Marks:"));
        var sum = c[0] + c[1] + c[2];
        var avg = sum / 3;
        document.write("<h1>User Name: " + a + "</h1>");
        document.write("<h1>User Age: " + b + "</h1>");
        document.write("<h1>User Marks: " + c[0] + ", " + c[1] + ", " + c[2] + "</h1>");
        document.write("<h1>Sum: " + sum + "</h1>");
        document.write("<h1>Average: " + avg + "</h1>");

    </script>
</body>

</html>
